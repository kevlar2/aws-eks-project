replicaCount: 2
image:
  # repository and tag are managed by CI — do not edit manually
  # Both are overwritten on every push to main by build-push-image.yaml using
  # the ECR registry URL derived from OIDC login (no account ID stored in Git).
  # format: {account}.dkr.ecr.{region}.amazonaws.com/{ECR_REPOSITORY}
  repository: PLACEHOLDER
  # format: v{SEMVER}-{SHORT_SHA} e.g. v1.2.3-abc1234
  tag: v0.1.2-2359484
  # IfNotPresent is correct here — CI always pushes an immutable tag so cached images are safe
  pullPolicy: IfNotPresent
containerPort: 3000
service:
  port: 80
ingress:
  enabled: true
  className: nginx
  host: app.kubevpro.bluebird-investments.co.uk
  tlsSecretName: game-2048-tls
  annotations:
    cert-manager.io/cluster-issuer: tls-cert-issuer
    external-dns.alpha.kubernetes.io/hostname: app.kubevpro.bluebird-investments.co.uk
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
